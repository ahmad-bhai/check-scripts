<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" href="tg.webp" type="image/x-icon">
    <title>Android Feedbacks - New UI</title>
</head>

<body>
    <div id="box">
        <div class="status_time">2:32</div>
        <div class="battery">25</div>
        
        <div class="tg_header">Telegram</div>
        
        <div class="tabs_container">
            <div class="tab">All Chats <span class="all_badge">48</span></div>
            <div class="tab active_tab">Personal <span class="personal_badge">46</span></div>
            <div class="tab">Unread <span class="unread_badge">56</span></div>
        </div>

        <ul class="ul_chat_name"></ul>
        <ul class="ul_chat_time"></ul>
        <ul class="ul_chat_dp"></ul>
        <ul class="ul_online_bullet"></ul>
        <ul class="ul_msg_img"></ul>
        <ul class="ul_count_bullet"></ul>

        <div class="bottom_nav">
            <div class="nav_item active_nav">
                <div class="nav_icon_wrapper">
                    <span class="chats_counts">47</span>
                    </div>
                <span class="nav_text">Chats</span>
            </div>
            <div class="nav_item">
                <span class="nav_text">Contacts</span>
            </div>
            <div class="nav_item">
                <span class="nav_text">Settings</span>
            </div>
            <div class="nav_item">
                <img src="https://ahmad-bhai-site.vercel.app/dp.png" class="logo" alt="Profile">
                <span class="nav_text">Profile</span>
            </div>
        </div>

        <div class="hide"></div>

        <img src="https://i.ibb.co/wZwdDYsc/Screenshot-20260623-143222.jpg" alt="Telegram Preview" class="bg_img">
    </div>

    <button class="btn" title="Download">
        <img src="https://raw.githubusercontent.com/ahmad-bhai/zeetex-currency-rate/0f914c89358480c47e3fdbb8a74f7020d938cf36/download.svg" alt="Download">
    </button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"
        integrity="sha512-BNaRQnYJYiPSqHHDb58B0yaPfCu+Wgds8Gp/gU33kqBtgNS4tSPHuGibyoeqMV/TJlSKda6FXzoEyYGjTe+vXA=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="check.js"></script>
</body>

</html>
