<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" href="tg.webp" type="image/x-icon">
    <title>Android Feedbacks</title>
</head>

<body>
    <div id="box">
        <!-- Top Device Info (Overlays on target position) -->
        <div class="status_time">9:40</div>
        <div class="battery">89</div>
        <div class="tg">Telegram</div>
        
        <!-- Tabs Badges Counters -->
        <div class="All">70</div>
        <div class="Personal">148</div>
        <div class="Unread">254</div>
        
        <!-- JavaScript Dynamic Arrays Output (Keep these verbatim for your loops) -->
        <ul class="ul_chat_name"></ul>
        <ul class="ul_chat_time"></ul>
        <ul class="ul_chat_dp"></ul>
        <ul class="ul_online_bullet"></ul>
        <ul class="ul_msg_img"></ul>
        <ul class="ul_count_bullet"></ul>
        
        <!-- Bottom Dynamic Navigation Fixed Structure -->
        <div class="bottom_nav">
            <div class="nav_item">
                <div class="chats_counts">2.6K</div>
                <span class="nav_text active_text">Chats</span>
            </div>
            <div class="nav_item">
                <span class="nav_text">Contacts</span>
            </div>
            <div class="nav_item">
                <span class="nav_text">Settings</span>
            </div>
            <div class="nav_item">
                <img src="https://ahmad-bhai-site.vercel.app/dp.png" class="logo" alt="Profile">
                <span class="nav_text">Profile</span>
            </div>
        </div>

        <div class="hide"></div>
        <!-- Background Image Template -->
        <img src="https://i.ibb.co/wZwdDYsc/Screenshot-20260623-143222.jpg" alt="" class="bg_img">
    </div>

    <!-- Floating Top Bar Action Button -->
    <button class="btn" title="Download">
        <img src="https://raw.githubusercontent.com/ahmad-bhai/zeetex-currency-rate/0f914c89358480c47e3fdbb8a74f7020d938cf36/download.svg" alt="Download">
    </button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"
        integrity="sha512-BNaRQnYJYiPSqHHDb58B0yaPfCu+Wgds8Gp/gU33kqBtgNS4tSPHuGibyoeqMV/TJlSKda6FXzoEyYGjTe+vXA=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://ahmad-ifeedback.vercel.app/scripts.js"></script>
</body>

</html>
